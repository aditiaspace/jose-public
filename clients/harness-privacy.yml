# Jose privacy overlay for pinned @deepseek-ai/dsh 0.2.1-rc.2.
# Session-log contribution and OTel export are separate channels; both stay off.
- id: session-log-deepseek
  name: '@deepseek-ai/dsh-session-log-deepseek'
  config:
    enabled: false
- id: session-telemetry-otel
  name: '@deepseek-ai/dsh-session-telemetry-otel'
  config:
    mode: DISABLED

# The Web profile's built-in agent presets expose model-facing web_fetch and
# web_search. Disable every shipped preset and select a Jose-only preset below.
- id: preset-standard
  disabled: true
- id: preset-ptc
  disabled: true
- id: preset-minimal
  disabled: true
- id: preset-cordis
  disabled: true
- id: agent-preset-registry
  config:
    default: jose

# Jose needs local workspace files and its CLI only; no model-facing web tools.
- insert:
    - id: preset-jose
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: jose
        order: 1
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: You are Jose, a local job-search workspace assistant. Follow the loaded Jose workspace instructions.
          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536
              projectRootMarkers:
                - .jose-workspace
          - id: tool-bash
            name: '@deepseek-ai/dsh-tool-bash'
            disabled: !!js process.platform === 'win32'
          - id: tool-pwsh
            name: '@deepseek-ai/dsh-tool-pwsh'
            disabled: !!js process.platform !== 'win32'
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false
          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'

# Remove host-side network providers too. Jobstreet URL intake is handled only
# by Jose's visible, approval-gated CLI flow, never by generic web tools.
- id: web
  disabled: true
- id: web-search-deepseek
  disabled: true
- id: web-deepseek-api
  disabled: true
- id: web-fetch-http
  disabled: true
- id: tool-web
  disabled: true
