<!doctype html>
<html lang="en"><meta charset="utf-8"><title>Review application with boost selected</title><body>
<main><h1>Fictional Data Analyst — Example Metrics Lab</h1><p>Expected salary: 10000000 IDR</p>
<form method="post" action="/job/fictional-101/apply/review">
  <fieldset><legend>Profile</legend><label for="applicant_name">Applicant name</label><input id="applicant_name" name="applicant_name" value="Fictional Candidate"><label for="applicant_email">Applicant email</label><input id="applicant_email" name="applicant_email" type="email" value="candidate@example.invalid"><label for="primary_cv">Jadikan CV utama</label><input id="primary_cv" name="primary_cv" type="checkbox"><label for="visibility">Profile visibility</label><select id="visibility" name="visibility"><option value="private" selected>Private</option><option value="public">Public</option></select></fieldset>
  <label for="boost">Boost application</label><input id="boost" name="boost" type="checkbox" checked>
  <button type="submit">Kirim lamaran</button>
</form></main></body></html>
